<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Tic-Tac-Toe Online</title>
    <style>
        body { background: #121212; color: #fff; font-family: 'Courier New', monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; overflow: hidden; }
        .hidden { display: none !important; }
        #room-overlay { position: fixed; background: #121212; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; }
        .game-board { display: grid; grid-template-columns: repeat(3, 100px); gap: 10px; background: #000; padding: 10px; border-radius: 10px; box-shadow: 0 0 20px #00ffcc55; }
        .cell { width: 100px; height: 100px; background: #1e1e1e; border: 2px solid #333; display: flex; align-items: center; justify-content: center; font-size: 3rem; cursor: pointer; transition: 0.3s; }
        .cell.x { color: #ff3333; text-shadow: 0 0 10px #ff3333; }
        .cell.o { color: #3388ff; text-shadow: 0 0 10px #3388ff; }
        #timer { font-size: 2rem; color: #00ffcc; margin-bottom: 10px; text-shadow: 0 0 5px #00ffcc; }
        .btn { margin-top: 20px; padding: 12px 25px; border: 2px solid #00ffcc; background: none; color: #00ffcc; cursor: pointer; text-transform: uppercase; font-weight: bold; }
        .btn:hover { background: #00ffcc; color: #121212; box-shadow: 0 0 15px #00ffcc; }
        input { background:#000; color:#00ffcc; border:2px solid #00ffcc; padding:15px; font-size:2rem; text-align:center; width: 200px; outline: none; margin: 20px; }
    </style>
</head>
<body>
    <div id="room-overlay">
        <h1 style="text-shadow: 0 0 10px #00ffcc;">ENTER 5-DIGIT CODE</h1>
        <input type="text" id="roomInput" maxlength="5" placeholder="00000">
        <button class="btn" onclick="joinGame()">JOIN GAME</button>
    </div>

    <div id="timer">10s</div>
    <div id="status" style="margin-bottom: 10px; color: #aaa;">Waiting for move...</div>
    <div class="game-board" id="board">
        <div class="cell" data-index="0"></div><div class="cell" data-index="1"></div><div class="cell" data-index="2"></div>
        <div class="cell" data-index="3"></div><div class="cell" data-index="4"></div><div class="cell" data-index="5"></div>
        <div class="cell" data-index="6"></div><div class="cell" data-index="7"></div><div class="cell" data-index="8"></div>
    </div>
    <button id="restartBtn" class="btn hidden">PLAY AGAIN (15s)</button>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
