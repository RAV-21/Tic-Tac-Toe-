<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Strike Pro</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="room-overlay">
        <div class="menu-card">
            <h1>NEON STRIKE</h1>
            <input type="text" id="roomInput" maxlength="5" placeholder="CODE">
            <button class="btn" onclick="joinGame()">ENTER ARENA</button>
        </div>
    </div>

    <div id="timer">10s</div>
    <div id="status">INITIALIZING...</div>

    <div class="game-board">
        <div class="cell" data-index="0"></div><div class="cell" data-index="1"></div><div class="cell" data-index="2"></div>
        <div class="cell" data-index="3"></div><div class="cell" data-index="4"></div><div class="cell" data-index="5"></div>
        <div class="cell" data-index="6"></div><div class="cell" data-index="7"></div><div class="cell" data-index="8"></div>
    </div>

    <button id="restartBtn" class="btn hidden">PLAY AGAIN (15s)</button>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
